apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'house-price-api'
        scrape_interval: 10s
        static_configs:
          - targets: ['house-price-api:80']
        metrics_path: '/metrics'
