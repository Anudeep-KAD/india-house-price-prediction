global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'house-price-monitor'

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'house-price-api'
    scrape_interval: 10s
    static_configs:
      - targets: ['house-price-api:8000']
    metrics_path: '/metrics'
